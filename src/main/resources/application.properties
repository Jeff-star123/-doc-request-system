spring.application.name=doc-request-system

# Server Port
server.port=${PORT:8080}

# MySQL Database Settings
# Priority: 1. SPRING_DATASOURCE_URL (Docker/Railway env var) -> 2. Railway MYSQL_URL -> 3. Localhost:3307 (Docker MySQL container port on Windows)
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:${MYSQLURL:jdbc:mysql://localhost:3307/doc_request_db?allowPublicKeyRetrieval=true&useSSL=false}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Telegram Bot Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN:8899447670:AAEf2lB22lM9eFM9aCVDZLGhL-bXhq068LA}

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# Disable Thymeleaf cache for local development/watch syncing
spring.thymeleaf.cache=false