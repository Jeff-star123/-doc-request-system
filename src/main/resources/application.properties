spring.application.name=doc-request-system

# Server Port
server.port=${PORT:8080}

# MySQL Database Settings (with local Docker Compose fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysqldb:3306/doc_request_db?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Telegram Bot Configuration
telegram.bot.token=8899447670:AAEf2lB22lM9eFM9aCVDZLGhL-bXhq068LA

# Multipart File Upload Limits (Fixes HTTP 413 Payload Error on Mobile)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# Disable Thymeleaf cache for local development/watch syncing
spring.thymeleaf.cache=false