spring.application.name=doc-request-system

# Server Port
server.port=${PORT:8080}

# Database Settings (Local Fallback or Cloud MySQL/TiDB)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/doc_request_db?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Table Creation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Telegram Bot Token
telegram.bot.token=${TELEGRAM_BOT_TOKEN:8899447670:AAEf2lB22lM9eFM9aCVDZLGhL-bXhq068LA}

# Cloudinary File Storage
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# File Upload Size Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

spring.thymeleaf.cache=false