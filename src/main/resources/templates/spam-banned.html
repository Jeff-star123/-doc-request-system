<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Deactivated - Spam Detected</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            margin: 0;
        }
        .banned-container {
            text-align: center;
            max-width: 550px;
            padding: 2rem;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        .banned-card {
            background: rgba(20, 27, 45, 0.95);
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(239, 68, 68, 0.15);
            backdrop-filter: blur(10px);
        }
        /* Full-screen jump scare overlay */
        #jumpScareOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.7);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s ease;
        }
        #jumpScareOverlay.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        .jumpscare-gif {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .jumpscare-content {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 2.5rem 3rem;
            border-radius: 20px;
            border: 2px solid rgba(255, 193, 7, 0.6);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            max-width: 90vw;
        }
    </style>
</head>
<body>

    <!-- Initial Warning State -->
    <div class="banned-container" id="initialWarningContainer">
        <div class="card banned-card text-danger shadow-lg p-4 rounded-4">
            <div class="card-body">
                <i class="bi bi-shield-fill-exclamation display-3 mb-3 text-danger"></i>
                <h3 class="fw-bold text-white mb-2">Account Deactivated!</h3>
                <p class="mb-3" style="color: #f87171 !important;"><strong>Reason:</strong> Continuous spamming of print requests detected.</p>
                <p class="small text-muted mb-4">Check your Telegram messages for details. Admin approval is required to restore access.</p>
                <a th:href="@{/}" class="btn btn-outline-light rounded-pill px-4 py-2 fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <!-- Full-Screen Jump Scare Overlay (Triggered after voice-over) -->
    <div id="jumpScareOverlay">
        <img src="https://cdn.imageurlgenerator.com/uploads/a15efddb-cf91-423a-9d93-072ac66f51c9.gif" alt="Jump Scare Budots" class="jumpscare-gif" />
        <div class="jumpscare-content">
            <h1 class="text-warning fw-bold display-5 mb-3">🚨 BUDOTS OVERLOAD! 🕺</h1>
            <p class="text-light fs-5 mb-4">Your account has been locked due to print request spamming.</p>
            <a th:href="@{/}" class="btn btn-danger btn-lg rounded-pill px-5 fw-bold shadow-lg">
                <i class="bi bi-box-arrow-left me-2"></i> Return to Login
            </a>
        </div>
    </div>

    <!-- Voice-over Audio -->
    <audio id="voiceOverAudio">
        <source src="https://www.image2url.com/r2/default/audio/1786220786484-fe21e581-e144-43bd-a4b0-a8e2686e6d18.mp3" type="audio/mpeg">
    </audio>

    <!-- Budots Background Music Audio -->
    <audio id="budotsAudio" loop>
        <source src="https://www.image2url.com/r2/default/audio/1786220306298-714d0fb6-9ebf-4572-ba8b-97d84e8b5283.mp3" type="audio/mpeg">
    </audio>

    <script>
        function runMultimediaBanSequence() {
            const voiceOver = document.getElementById('voiceOverAudio');
            const budotsMusic = document.getElementById('budotsAudio');
            const jumpScareOverlay = document.getElementById('jumpScareOverlay');
            const initialContainer = document.getElementById('initialWarningContainer');

            // Reset media state
            jumpScareOverlay.classList.remove('active');
            initialContainer.style.opacity = '1';
            budotsMusic.pause();
            budotsMusic.currentTime = 0;
            voiceOver.pause();
            voiceOver.currentTime = 0;

            // Play voice-over notification first
            voiceOver.play().catch(error => {
                console.log("Autoplay blocked by browser policy. User interaction required.");
            });

            // When voice-over finishes playing, fade out warning and trigger full-screen jump scare + music
            voiceOver.onended = () => {
                initialContainer.style.opacity = '0';
                setTimeout(() => {
                    budotsMusic.play().catch(e => console.log("Background music autoplay error:", e));
                    jumpScareOverlay.classList.add('active');
                }, 150);
            };
        }

        // Auto-run sequence on page load
        window.addEventListener('DOMContentLoaded', () => {
            runMultimediaBanSequence();
        });
    </script>
</body>
</html>
