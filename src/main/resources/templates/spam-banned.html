<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Deactivated - Spam Detected</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            margin: 0;
        }

        /* Initial Warning Card Styling (No Exit Button) */
        .banned-container {
            text-align: center;
            width: 100%;
            max-width: 480px;
            padding: 1.5rem;
            z-index: 10;
            transition: opacity 0.4s ease;
        }
        .banned-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 25px rgba(239, 68, 68, 0.2);
            backdrop-filter: blur(12px);
            padding: 2.5rem 2rem;
        }
        .warning-icon {
            font-size: 3.5rem;
            color: #ef4444;
            filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.5));
        }

        /* Full-screen Overlay & Background Video */
        #jumpScareOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 2rem;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }
        #jumpScareOverlay.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .jumpscare-video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Minimal Floating Top Banner UI (Unblocks Video Background) */
        .jumpscare-content {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(10, 10, 12, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 1rem 1.75rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 193, 7, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 193, 7, 0.2);
            display: flex;
            align-items: center;
            gap: 1.25rem;
            max-width: 90vw;
        }
        
        .jumpscare-text {
            text-align: left;
        }
        
        .jumpscare-text h2 {
            font-size: 1.1rem;
            margin: 0;
        }

        .jumpscare-text p {
            font-size: 0.8rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Initial Warning State (Exit button removed) -->
    <div class="banned-container" id="initialWarningContainer">
        <div class="card banned-card border-0">
            <div class="card-body p-0">
                <div class="mb-3">
                    <i class="bi bi-shield-fill-x warning-icon"></i>
                </div>
                <h3 class="fw-bold text-white mb-3">Account Deactivated!</h3>
                <p class="mb-3 text-white-50" style="font-size: 0.95rem;">
                    <strong class="text-danger">Reason:</strong> Continuous spamming of print requests detected.
                </p>
                <p class="small text-secondary mb-0 px-2" style="font-size: 0.85rem; line-height: 1.5;">
                    Check your Telegram messages for details. Admin approval is required to restore access.
                </p>
            </div>
        </div>
    </div>

    <!-- Full-Screen Jump Scare Overlay -->
    <div id="jumpScareOverlay">
        <video id="jumpscareVideo" class="jumpscare-video" loop muted playsinline>
            <source src="https://www.image2url.com/r2/default/videos/1786333720294-b9fe943c-f84a-4c19-8e75-858a603ff59d.mp4" type="video/mp4">
        </video>
        
        <!-- Non-intrusive Floating Header Notification -->
        <div class="jumpscare-content">
            <div class="jumpscare-text">
                <h2 class="text-warning fw-bold">🚨 BUDOTS OVERLOAD! 🕺</h2>
                <p class="text-light opacity-75">Account locked due to print request spamming.</p>
            </div>
            <a th:href="@{/}" class="btn btn-danger btn-sm rounded-pill px-3 py-1 fw-bold text-nowrap shadow-sm">
                <i class="bi bi-box-arrow-left me-1"></i> Return to Login
            </a>
        </div>
    </div>

    <!-- Voice-over Audio -->
    <audio id="voiceOverAudio">
        <source src="https://www.image2url.com/r2/default/audio/1786220786484-fe21e581-e144-43bd-a4b0-a8e2686e6d18.mp3" type="audio/mpeg">
    </audio>

    <!-- Budots Background Music Audio -->
    <audio id="budotsAudio" loop>
        <source src="https://www.image2url.com/r2/default/audio/1786220306298-714d0fb6-9ebf-4572-ba8b-97d84e8b5283.mp3" type="audio/mpeg">
    </audio>

    <script>
        function runMultimediaBanSequence() {
            const voiceOver = document.getElementById('voiceOverAudio');
            const budotsMusic = document.getElementById('budotsAudio');
            const jumpscareVideo = document.getElementById('jumpscareVideo');
            const jumpScareOverlay = document.getElementById('jumpScareOverlay');
            const initialContainer = document.getElementById('initialWarningContainer');

            // Reset media state
            jumpScareOverlay.classList.remove('active');
            initialContainer.style.opacity = '1';
            budotsMusic.pause();
            budotsMusic.currentTime = 0;
            voiceOver.pause();
            voiceOver.currentTime = 0;

            // Play voice-over notification first
            voiceOver.play().catch(error => {
                console.log("Autoplay blocked by browser policy. User interaction required.");
            });

            // Trigger full overlay & Budots video upon voice-over completion
            voiceOver.onended = () => {
                initialContainer.style.opacity = '0';
                setTimeout(() => {
                    jumpscareVideo.play().catch(e => console.log("Video playback error:", e));
                    budotsMusic.play().catch(e => console.log("Background music autoplay error:", e));
                    jumpScareOverlay.classList.add('active');
                }, 150);
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            runMultimediaBanSequence();
        });
    </script>
</body>
</html>
