<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Portal - Student Dashboard</title>
    
    <!-- External Frameworks -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe & Tesseract AI Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <!-- Custom Extracted Dashboard CSS -->
    <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">
</head>
<body>

    <!-- 1. Header Navigation Fragment -->
    <div th:replace="~{fragments/dashboard/navbar :: navbar}"></div>

    <div class="container d-flex flex-column gap-4">
        
        <!-- Notifications Banner -->
        <div class="reveal-on-scroll">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm mb-3 rounded-3 border-0" role="alert" style="background: rgba(25, 135, 84, 0.15); backdrop-filter: blur(10px);">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-check-circle-fill fs-4 text-success"></i>
                    <div>
                        <h6 class="alert-heading mb-0 fw-bold text-success">Success!</h6>
                        <span class="small" th:text="${success}">Request submitted successfully</span>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-3 rounded-3 border-0" role="alert" style="background: rgba(220, 53, 69, 0.15); backdrop-filter: blur(10px);">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-triangle-fill fs-4 text-danger"></i>
                    <div>
                        <h6 class="alert-heading mb-0 fw-bold text-danger">Error!</h6>
                        <span class="small" th:text="${error}">Error message</span>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="alert alert-info alert-dismissible fade show border-0 mb-0 rounded-3 shadow-sm" role="alert" style="background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);">
                <div class="d-flex align-items-center gap-2 mb-1">
                    <i class="bi bi-telegram fs-4 text-primary"></i>
                    <h6 class="alert-heading mb-0 fw-bold">Get Instant Request Updates on Telegram!</h6>
                </div>
                <p class="mb-1 small text-secondary">
                    To receive automated status notifications when your document is processed, open 
                    <a href="https://t.me/BrgyDocRequestBot" target="_blank" class="badge bg-primary fs-6 text-decoration-none">@BrgyDocRequestBot <i class="bi bi-box-arrow-up-right"></i></a> and tap <b>START</b>.
                </p>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

        <!-- 2. Request History Component -->
        <div th:replace="~{fragments/dashboard/history-table :: historyTable}"></div>

        <!-- 3. Document Application Form Component -->
        <div th:replace="~{fragments/dashboard/document-form :: documentForm}"></div>

        <!-- 4. About System Component -->
        <div th:replace="~{fragments/dashboard/about-section :: aboutSection}"></div>

        <!-- 5. Developers Carousel Component -->
        <div th:replace="~{fragments/dashboard/dev-section :: devSection}"></div>

    </div>

    <!-- 6. Modals Fragment (Camera, Lightbox, Scan & Anti-spam) -->
    <div th:replace="~{fragments/dashboard/modals :: modals}"></div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom Extracted Dashboard JS -->
    <script th:src="@{/js/dashboard.js}" src="/js/dashboard.js"></script>

    <!-- Dify AI Chatbot Integration Script -->
    <script>
     window.difyChatbotConfig = {
      token: 'tuMY58SadttfVKCz',
      inputs: {},
      systemVariables: {},
      userVariables: {}
     }
    </script>
    <script src="https://udify.app/embed.min.js" id="tuMY58SadttfVKCz" defer></script>

</body>
</html>
