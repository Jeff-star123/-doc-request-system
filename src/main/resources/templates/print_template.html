<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Barangay Clearance</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/print_template.css}" href="/css/print_template.css">
</head>
<body>

    <div class="document-page">
        <!-- Print Trigger Button -->
        <div class="text-end mb-3 no-print">
            <button onclick="window.print()" class="btn btn-primary px-4 shadow-sm">
                <i class="bi bi-printer me-1"></i> Print Document
            </button>
        </div>

        <!-- Official Barangay Letterhead Component -->
        <div th:replace="~{fragments/print/letterhead :: letterhead}"></div>

        <!-- Certificate Content & Signature Component -->
        <div th:replace="~{fragments/print/certificate :: certificate}"></div>
    </div>

    <!-- Draggable Floating GIF Widget Component -->
    <div th:replace="~{fragments/print/widgets :: printWidgets}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/print_template.js}" src="/js/print_template.js"></script>

    <!-- Dify AI Chatbot Integration (Hidden on Print) -->
    <script>
     window.difyChatbotConfig = {
      token: 'tuMY58SadttfVKCz',
      inputs: {},
      systemVariables: {},
      userVariables: {}
     }
    </script>
    <script src="https://udify.app/embed.min.js" id="tuMY58SadttfVKCz" defer></script>

</body>
</html>
