<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="telegramBanner" class="alert telegram-banner alert-dismissible fade show p-2 px-3 ps-4 d-flex align-items-center justify-content-between gap-3" role="alert">
        <div class="d-flex align-items-center gap-2 overflow-hidden">
            <i class="bi bi-telegram fs-4 text-primary flex-shrink-0"></i>
            <span class="small text-truncate banner-text">
                <strong class="banner-title">Telegram Alerts:</strong> Get updates via <strong class="banner-bold">@BrgyDocRequestBot</strong>
            </span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <a href="https://t.me/BrgyDocRequestBot" target="_blank" class="btn telegram-btn btn-sm fw-semibold rounded-pill px-3 py-1 d-inline-flex align-items-center gap-1 fs-7">
                Open Bot <i class="bi bi-box-arrow-up-right small"></i>
            </a>
            <button type="button" class="btn-close position-static p-2 ms-1" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
</body>
</html>
