<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="historyTable" class="card card-custom request-history-card p-4 reveal-on-scroll focal-card">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h5 class="fw-bold mb-0 text-dark">
                <i class="bi bi-clock-history text-primary me-2"></i> My Request History
            </h5>
            <span class="badge bg-primary bg-opacity-10 text-primary fw-semibold px-2 py-1">Live Updates</span>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light small">
                    <tr>
                        <th>Document</th>
                        <th>Purpose</th>
                        <th>Status</th>
                        <th class="text-end">Action</th>
                    </tr>
                </thead>
                <tbody class="small">
                    <tr th:each="req : ${requests}">
                        <td class="fw-semibold" th:text="${req.documentType}">Clearance</td>
                        <td class="text-muted" th:text="${req.purpose}">Purpose</td>
                        <td>
                            <span th:if="${req.status == 'PENDING'}" class="badge bg-warning text-dark">PENDING</span>
                            <span th:if="${req.status == 'APPROVED'}" class="badge bg-success">APPROVED</span>
                            <span th:if="${req.status == 'REJECTED'}" class="badge bg-danger">REJECTED</span>
                        </td>
                        <td class="text-end">
                            <a th:if="${req.status == 'APPROVED'}" 
                               th:href="@{'/request/print/' + ${req.id}}" 
                               class="btn btn-sm btn-outline-success px-2 py-1 print-btn" 
                               target="_blank">
                                <i class="bi bi-printer-fill"></i> Print
                            </a>
                            <span th:if="${req.status != 'APPROVED'}" class="text-muted">--</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(requests)}">
                        <td colspan="4" class="text-center text-muted py-4">No request history found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
