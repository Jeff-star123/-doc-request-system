<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="usersTable" class="card card-custom shadow-sm p-4 reveal-on-scroll focal-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title text-dark mb-0 fw-bold">
                <i class="bi bi-people-fill text-primary me-2"></i> Registered Users & Anti-Spam Control
            </h5>
            <span class="badge bg-primary bg-opacity-10 text-primary fw-semibold px-2 py-1">User Directory</span>
        </div>
        
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light small">
                    <tr>
                        <th>ID</th>
                        <th>FULL NAME</th>
                        <th>USERNAME</th>
                        <th>ROLE</th>
                        <th>STATUS</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${allUsers}">
                        <td th:text="${u.id}">1</td>
                        <td th:text="${u.fullName}">Name</td>
                        <td th:text="${'@' + u.username}">username</td>
                        <td th:text="${u.role}">STUDENT</td>
                        <td>
                            <span class="badge" th:classappend="${u.status == 'ACTIVE' || u.status == null ? 'bg-success' : (u.status == 'REACTIVATION_PENDING' ? 'bg-warning text-dark' : 'bg-secondary')}" th:text="${u.status != null ? u.status : 'ACTIVE'}">ACTIVE</span>
                        </td>
                        <td>
                            <span th:if="${u.role == 'ADMIN'}" class="text-muted small">System Admin</span>
                            
                            <div th:if="${u.role != 'ADMIN'}" class="d-flex gap-1">
                                <form th:if="${u.status == 'ACTIVE' || u.status == null}" th:action="@{/admin/user/deactivate/{id}(id=${u.id})}" method="post" class="d-inline" onsubmit="return confirm('⚠️ WARNING: Deactivating this account will lock the user out. They will require ADMIN APPROVAL to reactivate their account. Do you wish to proceed?');">
                                    <button type="submit" class="btn btn-warning btn-sm"><i class="bi bi-pause-circle"></i> Deactivate</button>
                                </form>

                                <button th:if="${u.status == 'DEACTIVATED' || u.status == 'REACTIVATION_PENDING'}" type="button" class="btn btn-success btn-sm" data-bs-toggle="modal" th:data-bs-target="'#approveReactivationModal' + ${u.id}">
                                    <i class="bi bi-check-circle"></i> Activate
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
