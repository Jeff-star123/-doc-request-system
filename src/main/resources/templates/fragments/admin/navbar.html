<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="adminNavbar" class="navbar navbar-expand-lg navbar-dark dashboard-navbar sticky-top py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="#">
                <div class="logo-wrapper-sm">
                    <img src="https://cdn.phototourl.com/free/2026-08-08-4120abee-3ef2-4435-963d-1f1075db6535.jpg" 
                         alt="Logo" 
                         class="logo-img-sm" 
                         onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1041/1041883.png';">
                </div>
                Barangay Admin Console
            </a>

            <!-- Navigation Pills Bar -->
            <div class="d-none d-lg-flex align-items-center gap-2 nav-pills-bar mx-auto">
                <button class="nav-pill-item active" id="pillHome" onclick="closeOverlayHub()"><i class="bi bi-speedometer2 me-1"></i> Dashboard</button>
                <button class="nav-pill-item" id="pillRequests" onclick="openOverlayHub(0)"><i class="bi bi-card-checklist me-1"></i> Requests</button>
                <button class="nav-pill-item" id="pillReactivations" onclick="openOverlayHub(1)"><i class="bi bi-person-exclamation me-1"></i> Reactivations</button>
                <button class="nav-pill-item" id="pillUsers" onclick="openOverlayHub(2)"><i class="bi bi-people-fill me-1"></i> User Directory</button>
                <button class="nav-pill-item" id="pillAbout" onclick="openOverlayHub(3)"><i class="bi bi-info-circle-fill me-1"></i> About System</button>
                <button class="nav-pill-item" id="pillDevs" onclick="openOverlayHub(4)"><i class="bi bi-code-slash me-1"></i> Developers</button>
            </div>

            <!-- Right Controls -->
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-light btn-sm px-2 py-1 rounded-pill themeToggleBtn" title="Toggle Dark/Light Mode">
                    <i class="themeIcon bi bi-moon-fill"></i> <span class="d-none d-md-inline small ms-1">Theme</span>
                </button>
                <span class="navbar-text text-light d-none d-sm-inline me-2 small">
                    <i class="bi bi-shield-lock-fill text-warning me-1"></i> <strong th:text="${adminUser.fullName}">Administrator</strong>
                </span>

                <!-- Logout Confirmation Modal Trigger -->
                <button type="button" class="btn btn-outline-danger btn-sm px-3 rounded-pill" data-bs-toggle="modal" data-bs-target="#logoutConfirmModal">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </button>
            </div>
        </div>
    </nav>
</body>
</html>
