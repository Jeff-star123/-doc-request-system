<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="requestsTable" class="card card-custom shadow-sm p-4 reveal-on-scroll focal-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title text-dark mb-0 fw-bold">
                <i class="bi bi-card-checklist text-primary me-2"></i> Document Requests Management
            </h5>
            <span class="badge bg-primary bg-opacity-10 text-primary fw-semibold px-2 py-1">Real-time Review</span>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light small">
                    <tr>
                        <th>ID</th>
                        <th>Resident Name</th>
                        <th>Document Type</th>
                        <th>Purpose</th>
                        <th>Verification</th>
                        <th>Status</th>
                        <th>Remarks</th>
                        <th class="text-center" style="min-width: 220px;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="req : ${requests}">
                        <td class="fw-bold" th:text="'#' + ${req.id}">#1</td>
                        <td class="fw-bold text-primary" th:text="${req.user != null ? req.user.fullName : 'N/A'}">Juan Dela Cruz</td>
                        <td th:text="${req.documentType}">Clearance</td>
                        <td class="small text-muted" th:text="${req.purpose != null ? req.purpose : '—'}">Purpose</td>
                        
                        <td>
                            <button class="btn btn-sm btn-outline-info" data-bs-toggle="modal" th:data-bs-target="'#idModal' + ${req.id}">
                                <i class="bi bi-person-bounding-box"></i> View Verification
                            </button>
                        </td>

                        <td>
                            <span class="badge" 
                                th:classappend="${req.status == 'APPROVED' ? 'badge-approved' : (req.status == 'REJECTED' ? 'badge-rejected' : 'badge-pending')}"
                                th:text="${req.status}">PENDING</span>
                        </td>
                        <td class="small text-muted" th:text="${req.remarks != null ? req.remarks : '—'}">—</td>
                        <td class="text-center">
                            <div class="d-flex gap-1 justify-content-center">
                                <div th:if="${req.status == 'PENDING'}" class="d-flex gap-1">
                                    <button class="btn btn-sm btn-success" data-bs-toggle="modal" th:data-bs-target="'#approveModal' + ${req.id}">
                                        <i class="bi bi-check-circle"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger" data-bs-toggle="modal" th:data-bs-target="'#rejectModal' + ${req.id}">
                                        <i class="bi bi-x-circle"></i>
                                    </button>
                                </div>
                                <form th:action="@{/admin/request/delete/{id}(id=${req.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to permanently delete this request?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Delete Request Permanently">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(requests)}">
                        <td colspan="8" class="text-center text-muted py-4">No document requests found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
