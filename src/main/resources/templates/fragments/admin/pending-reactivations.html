<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="pendingReactivations" th:if="${not #lists.isEmpty(pendingReactivations)}" class="card card-custom border-warning shadow-sm reveal-on-scroll focal-card">
        <div class="card-header bg-warning bg-opacity-10 fw-bold text-dark d-flex align-items-center justify-content-between rounded-top-4 border-0 py-3">
            <span class="text-dark"><i class="bi bi-person-exclamation me-2"></i> Pending Account Reactivation Requests</span>
            <span class="badge bg-warning text-dark fw-semibold" th:text="${#lists.size(pendingReactivations)}">0</span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light small">
                        <tr>
                            <th>USER ID</th>
                            <th>FULL NAME</th>
                            <th>USERNAME</th>
                            <th>ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${pendingReactivations}">
                            <td th:text="${u.id}">1</td>
                            <td th:text="${u.fullName}">Name</td>
                            <td th:text="${'@' + u.username}">username</td>
                            <td class="text-nowrap">
                                <div class="d-flex flex-column flex-sm-row gap-2">
                                    <button type="button" class="btn btn-success btn-sm w-100" data-bs-toggle="modal" th:data-bs-target="'#approveReactivationModal' + ${u.id}">
                                        <i class="bi bi-check-circle"></i> Approve
                                    </button>
                                    <button type="button" class="btn btn-outline-danger btn-sm w-100" data-bs-toggle="modal" th:data-bs-target="'#rejectReactivationModal' + ${u.id}">
                                        <i class="bi bi-x-circle"></i> Reject
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
