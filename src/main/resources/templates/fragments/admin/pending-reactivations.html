<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="pendingReactivations" th:if="${not #lists.isEmpty(pendingReactivations)}" class="card card-custom border-warning border-opacity-40 shadow-lg reveal-on-scroll focal-card mb-4 bg-warning bg-opacity-10 admin-card-theme">
        
        <!-- EMBEDDED SCOPED STYLES -->
        <style>
            .text-warning-adaptive {
                color: #92400e !important;
            }

            [data-bs-theme="dark"] .text-warning-adaptive {
                color: #fbbf24 !important;
            }

            .border-warning-adaptive {
                border-color: rgba(217, 119, 6, 0.4) !important;
            }

            [data-bs-theme="dark"] .border-warning-adaptive {
                border-color: rgba(251, 191, 36, 0.3) !important;
            }

            /* Responsive Mobile Card Item */
            .reactivation-mobile-card {
                background: rgba(125, 125, 125, 0.08);
                border: 1px solid var(--bs-border-color-translucent);
                border-radius: 14px;
                padding: 12px;
            }
        </style>

        <!-- Header -->
        <div class="p-3 border-bottom border-warning-adaptive d-flex align-items-center justify-content-between flex-wrap gap-2">
            <h6 class="fw-bold mb-0 text-body d-flex align-items-center gap-2 fs-6 fs-md-5">
                <i class="bi bi-person-exclamation text-warning fs-5"></i> Pending Account Reactivation Requests
            </h6>
            <!-- 100% High Contrast Number Badge -->
            <span class="badge bg-warning text-dark font-monospace fw-bold px-3 py-1.5 rounded-pill shadow-sm fs-6" th:text="${#lists.size(pendingReactivations)}">1</span>
        </div>

        <div class="p-2 p-md-3">
            <!-- DESKTOP TABLE VIEW (Visible on md and up) -->
            <div class="d-none d-md-block table-responsive admin-table-wrapper">
                <table class="table align-middle mb-0" style="min-width: 580px;">
                    <thead>
                        <tr>
                            <th class="ps-3 py-3" style="width: 32%;">User Details</th>
                            <th class="py-3" style="width: 23%;">Username</th>
                            <th class="py-3" style="width: 25%;">Status</th>
                            <th class="text-end pe-3 py-3" style="width: 20%;">Action Required</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${pendingReactivations}" class="admin-row">
                            <td class="ps-3 py-3">
                                <div class="d-flex align-items-center gap-2">
                                    <div class="text-primary rounded-circle d-flex align-items-center justify-content-center p-2 bg-primary bg-opacity-10 border border-primary border-opacity-20 flex-shrink-0" style="width: 38px; height: 38px;">
                                        <i class="bi bi-person-fill fs-5"></i>
                                    </div>
                                    <div>
                                        <h6 class="fw-bold mb-0 text-body" th:text="${u.fullName}">Resident Name</h6>
                                        <span class="small text-secondary" th:text="'User ID #' + ${u.id}">ID #1</span>
                                    </div>
                                </div>
                            </td>
                            <td class="py-3">
                                <span class="badge bg-body-tertiary text-body border px-2 py-1 font-monospace" th:text="${'@' + u.username}">@username</span>
                            </td>
                            <td class="py-3">
                                <span class="badge badge-status-pending rounded-pill px-3 py-1 fw-bold d-inline-flex align-items-center gap-2">
                                    <span class="status-pulse-dot"></span> REACTIVATION REQUESTED
                                </span>
                            </td>
                            <td class="text-end pe-3 py-3">
                                <div class="d-inline-flex gap-2">
                                    <button type="button" class="btn btn-sm btn-success rounded-pill px-3 fw-bold shadow-sm" data-bs-toggle="modal" th:data-bs-target="'#approveReactivationModal' + ${u.id}">
                                        <i class="bi bi-check-circle-fill me-1"></i> Approve
                                    </button>
                                    <button type="button" class="btn btn-sm btn-outline-danger rounded-pill px-3 fw-bold" data-bs-toggle="modal" th:data-bs-target="'#rejectReactivationModal' + ${u.id}">
                                        <i class="bi bi-x-circle me-1"></i> Reject
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- MOBILE STACKED CARDS VIEW (Visible on mobile screens) -->
            <div class="d-md-none d-flex flex-column gap-2">
                <div th:each="u : ${pendingReactivations}" class="reactivation-mobile-card">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <div class="d-flex align-items-center gap-2">
                            <div class="text-primary rounded-circle d-flex align-items-center justify-content-center p-2 bg-primary bg-opacity-10 border border-primary border-opacity-20 flex-shrink-0" style="width: 36px; height: 36px;">
                                <i class="bi bi-person-fill fs-5"></i>
                            </div>
                            <div>
                                <h6 class="fw-bold mb-0 text-body fs-6" th:text="${u.fullName}">Resident Name</h6>
                                <span class="badge bg-body-tertiary text-body border px-2 py-0.5 font-monospace small" th:text="${'@' + u.username}">@username</span>
                            </div>
                        </div>
                        <span class="small text-secondary font-monospace" th:text="'#' + ${u.id}">#1</span>
                    </div>

                    <div class="mb-3">
                        <span class="badge badge-status-pending rounded-pill px-2.5 py-1 small fw-bold d-inline-flex align-items-center gap-1.5">
                            <span class="status-pulse-dot"></span> REACTIVATION REQUESTED
                        </span>
                    </div>

                    <div class="row g-2">
                        <div class="col-6">
                            <button type="button" class="btn btn-success btn-sm w-100 rounded-pill fw-bold shadow-sm" data-bs-toggle="modal" th:data-bs-target="'#approveReactivationModal' + ${u.id}">
                                <i class="bi bi-check-circle-fill me-1"></i> Approve
                            </button>
                        </div>
                        <div class="col-6">
                            <button type="button" class="btn btn-outline-danger btn-sm w-100 rounded-pill fw-bold" data-bs-toggle="modal" th:data-bs-target="'#rejectReactivationModal' + ${u.id}">
                                <i class="bi bi-x-circle me-1"></i> Reject
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
