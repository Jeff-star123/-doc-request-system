<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="securitySection" class="card card-custom focal-card shadow-sm p-4 mb-4 settings-section" id="securitySection">
        <div class="d-flex align-items-center justify-content-between mb-3">
            <h5 class="text-primary fw-bold mb-0">
                <i class="bi bi-shield-lock-fill me-2"></i> Password Security
            </h5>
            <span class="badge bg-primary bg-opacity-10 text-primary fw-semibold px-2 py-1">Security</span>
        </div>
        
        <p class="text-muted small mb-4">Ensure your account is using a strong password to maintain security against unauthorized access.</p>
        
        <div>
            <button type="button" class="btn btn-outline-primary fw-semibold" data-bs-toggle="modal" data-bs-target="#changePasswordModal">
                <i class="bi bi-key-fill me-1"></i> Change Password
            </button>
        </div>
    </div>
</body>
</html>
