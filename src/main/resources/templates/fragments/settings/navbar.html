<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="settingsNavbar" class="navbar navbar-expand-lg navbar-dark dashboard-navbar sticky-top py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" th:href="@{/dashboard}">
                <div class="logo-wrapper-sm">
                    <img src="https://cdn.phototourl.com/free/2026-08-08-4120abee-3ef2-4435-963d-1f1075db6535.jpg" 
                         alt="Logo" 
                         class="logo-img-sm" 
                         onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1041/1041883.png';">
                </div>
                Barangay Request Portal
            </a>

            <!-- Navigation Pills Bar -->
            <div class="d-none d-lg-flex align-items-center gap-2 nav-pills-bar mx-auto">
                <a th:href="@{/dashboard}" class="nav-pill-item"><i class="bi bi-house-door-fill me-1"></i> Dashboard</a>
                <a th:href="@{/settings}" class="nav-pill-item active"><i class="bi bi-gear-fill me-1"></i> Settings</a>
            </div>

            <!-- Right User Controls (Null-Safe Check) -->
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-outline-light btn-sm px-2 py-1 rounded-pill themeToggleBtn" id="themeToggleBtn" title="Toggle Theme">
                    <i id="themeIcon" class="themeIcon bi bi-moon-fill"></i> <span class="d-none d-md-inline small ms-1">Theme</span>
                </button>
                <span class="navbar-text text-light d-none d-sm-inline me-2 small">
                    <i class="bi bi-person-circle text-info me-1"></i> <strong th:text="${user != null ? user.fullName : 'User'}">User</strong>
                </span>

                <!-- Logout Confirmation Modal Trigger -->
                <button type="button" class="btn btn-outline-danger btn-sm px-3 rounded-pill" data-bs-toggle="modal" data-bs-target="#logoutConfirmModal">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </button>
            </div>
        </div>
    </nav>
</body>
</html>
