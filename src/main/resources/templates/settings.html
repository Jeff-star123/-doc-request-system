<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Portal - Account Settings</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/settings.css}" href="/css/settings.css">
</head>
<body>

    <!-- Header Navbar Component -->
    <div th:replace="~{fragments/settings/navbar :: settingsNavbar}"></div>

    <div class="container py-3 d-flex flex-column gap-4">
        
        <!-- Notifications & Telegram Alerts -->
        <div class="reveal-on-scroll">
            <div th:if="${user.telegramChatId == null or user.telegramChatId == ''}" class="alert alert-info alert-dismissible fade show border-0 mb-3 rounded-3 shadow-sm" role="alert" style="background: rgba(224, 242, 254, 0.9); backdrop-filter: blur(10px); color: #0369a1;">
                <div class="d-flex align-items-center gap-2 mb-1">
                    <i class="bi bi-telegram fs-4 text-primary"></i>
                    <h6 class="alert-heading mb-0 fw-bold">Get Instant Request Updates on Telegram!</h6>
                </div>
                <p class="mb-1 small text-secondary">
                    To receive automated status notifications when your document is processed, open 
                    <a href="https://t.me/BrgyDocRequestBot" target="_blank" class="badge bg-primary fs-6 text-decoration-none">@BrgyDocRequestBot <i class="bi bi-box-arrow-up-right"></i></a> and tap <b>START</b>.
                </p>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm rounded-3 border-0" role="alert" style="background: rgba(25, 135, 84, 0.15); backdrop-filter: blur(10px);">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-check-circle-fill fs-4 text-success"></i>
                    <div>
                        <h6 class="alert-heading mb-0 fw-bold text-success">Success!</h6>
                        <span class="small" th:text="${successMessage}">Success</span>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm rounded-3 border-0" role="alert" style="background: rgba(220, 53, 69, 0.15); backdrop-filter: blur(10px);">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-triangle-fill fs-4 text-danger"></i>
                    <div>
                        <h6 class="alert-heading mb-0 fw-bold text-danger">Error!</h6>
                        <span class="small" th:text="${errorMessage}">Error</span>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

        <div class="row g-4 reveal-on-scroll">
            
            <!-- Left Navigation Sidebar Component -->
            <div class="col-lg-3">
                <div th:replace="~{fragments/settings/sidebar :: sidebar}"></div>
            </div>

            <!-- Right Content Area -->
            <div class="col-lg-9">
                <!-- Profile Section Component -->
                <div th:replace="~{fragments/settings/profile-section :: profileSection}"></div>

                <!-- Password & Security Section Component -->
                <div th:replace="~{fragments/settings/security-section :: securitySection}"></div>

                <!-- Account Deactivation Section Component -->
                <div th:replace="~{fragments/settings/deactivate-section :: deactivateSection}"></div>
            </div>

        </div>
    </div>

    <!-- Modals & Draggable Widget Component -->
    <div th:replace="~{fragments/settings/modals :: settingsModals}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/settings.js}" src="/js/settings.js"></script>

    <!-- Dify AI Chatbot Integration Script -->
    <script>
     window.difyChatbotConfig = {
      token: 'tuMY58SadttfVKCz',
      inputs: {},
      systemVariables: {},
      userVariables: {}
     }
    </script>
    <script src="https://udify.app/embed.min.js" id="tuMY58SadttfVKCz" defer></script>

</body>
</html>
