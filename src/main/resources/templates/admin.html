<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Portal - Admin Panel</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body>

    <!-- Header Navbar Component -->
    <div th:replace="~{fragments/admin/navbar :: adminNavbar}"></div>

    <div class="container d-flex flex-column gap-4 pb-5">

        <!-- Enhanced UI Flash Message Banners -->
        <div class="reveal-on-scroll">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm mb-0 rounded-3 border-0" role="alert" style="background: rgba(25, 135, 84, 0.15); backdrop-filter: blur(10px);">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-check-circle-fill fs-4 text-success"></i>
                    <div>
                        <h6 class="alert-heading mb-0 fw-bold text-success">Success!</h6>
                        <span class="small" th:text="${success}"></span>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm mb-0 rounded-3 border-0" role="alert" style="background: rgba(220, 53, 69, 0.15); backdrop-filter: blur(10px);">
                <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-triangle-fill fs-4 text-danger"></i>
                    <div>
                        <h6 class="alert-heading mb-0 fw-bold text-danger">Error!</h6>
                        <span class="small" th:text="${error}"></span>
                    </div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>

        <!-- Pending Account Reactivations Review Component -->
        <div th:replace="~{fragments/admin/pending-reactivations :: pendingReactivations}"></div>

        <!-- Document Requests Management Component -->
        <div th:replace="~{fragments/admin/requests-table :: requestsTable}"></div>

        <!-- User Accounts Management Component -->
        <div th:replace="~{fragments/admin/users-table :: usersTable}"></div>

    </div>

    <!-- Admin Modals & Draggable Widget Component -->
    <div th:replace="~{fragments/admin/modals :: adminModals}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/admin.js}" src="/js/admin.js"></script>

    <!-- Dify AI Chatbot Integration Script -->
    <script>
     window.difyChatbotConfig = {
      token: 'tuMY58SadttfVKCz',
      inputs: {},
      systemVariables: {},
      userVariables: {}
     }
    </script>
    <script src="https://udify.app/embed.min.js" id="tuMY58SadttfVKCz" defer></script>

</body>
</html>
